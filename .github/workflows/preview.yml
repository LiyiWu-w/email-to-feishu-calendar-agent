name: Preview recruitment emails (private fork only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Preview without personal event details
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DRY_RUN: 'true'
          SHOW_EVENT_DETAILS: 'false'
          MAX_EMAILS: '20'
          BACKFILL_DAYS: '7'
        run: python agent.py
